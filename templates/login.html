<!DOCTYPE html>
<html lang="es">

<head>
	<title>KAPPS.me</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="{{ url_for('static', filename='login_files/favicon.ico') }}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
	<link rel="stylesheet" href="{{ url_for('static', filename='login_files/login_modern.css') }}">
</head>

<body>
	<main class="stage">

		<section class="scene" aria-hidden="true">
			<div class="hero-logo">
				<img src="{{ url_for('static', filename='login_files/logo.webp') }}" alt="" data-liquid="idle" width="582" height="632">
			</div>
		</section>

		<div class="card-wrap">
			<div class="wrap-login100" id="tilt">
				<form class="login100-form validate-form" action="{{ url_for('login') }}" method="post" id="ingreso"
					name="ingreso" novalidate>
					<div class="brand"><b>KAPPS.me</b><span>Admin</span></div>
					<p class="subtitle">Acceso para administradores.</p>

					<div class="wrap-input100 validate-input" data-validate="No debe estar vacío">
						<input class="input100" type="text" name="username" id="username" autocomplete="username">
						<span class="focus-input100" data-placeholder="Usuario"></span>
					</div>

					<div class="wrap-input100 validate-input" data-validate="Ingrese la contraseña">
						<input class="input100" type="password" name="password" id="password"
							autocomplete="current-password">
						<span class="focus-input100" data-placeholder="Contraseña"></span>
						<!-- el ojo va DESPUÉS del campo: así el Tab pasa de usuario a contraseña y luego al ojo -->
						<span class="btn-show-pass" role="button" tabindex="0" aria-label="Mostrar contraseña">
							<svg class="ojo" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.100 11-7c-1.700-3.900-6-7-11-7zm0 11.500A4.500 4.500 0 1 1 12 7.500a4.500 4.500 0 0 1 0 9zm0-7A2.500 2.500 0 1 0 12 14.500 2.500 2.500 0 0 0 12 9.500z"/></svg>
							<svg class="ojo-off" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" hidden><path d="M12 7c2.800 0 5 2.200 5 5 0 .6-.1 1.100-.3 1.600l2.900 2.900A11.800 11.800 0 0 0 23 12c-1.700-3.900-6-7-11-7-1.400 0-2.700.2-3.900.7l2.200 2.200C11 7.100 11.500 7 12 7zM2 4.300 4.600 6.900A11.700 11.700 0 0 0 1 12c1.700 3.900 6 7 11 7 1.500 0 3-.3 4.300-.8l3 3 1.400-1.400L3.400 2.900 2 4.300zm5.300 5.300 1.500 1.500A2.900 2.900 0 0 0 8.700 12 3.300 3.300 0 0 0 12 15.300c.3 0 .6 0 .9-.1l1.500 1.500c-.7.300-1.500.5-2.400.5A5 5 0 0 1 7 12c0-.9.200-1.700.3-2.400z"/></svg>
						</span>
					</div>
					{% if msg: %}
					<div class="msg-error" role="alert">{{ msg | safe }}</div>
					{% endif %}
					<button class="login100-form-btn" type="submit">Ingresar</button>
				</form>
			</div>
		</div>
	</main>

	<script src="{{ url_for('static', filename='login_files/login.js') }}"></script>
	<script src="{{ url_for('static', filename='liquid.js') }}" defer></script>
</body>

</html>
